server {
    listen 80;
    server_name syl-ia.com www.syl-ia.com;
    server_tokens off;

    # Permitir a Let's Encrypt realizar el desafío HTTP-01
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirigir todo el tráfico HTTP a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name syl-ia.com www.syl-ia.com;
    server_tokens off;

    # Rutas a los certificados de Let's Encrypt
    # NOTA: Asegúrate de reemplazar YOUR_DOMAIN por tu dominio real
    ssl_certificate /etc/letsencrypt/live/syl-ia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/syl-ia.com/privkey.pem;

    # Opciones de seguridad SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Archivos estáticos del frontend
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # Necesario para React Router (SPA)
        try_files $uri $uri/ /index.html;
    }

    # Proxy para el Backend FastAPI
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_addrs;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
